<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Percentage using Spread Operator</title>
    <script>
        function calculatePercentage(...marks) {
            let totalMarks = 0;
            for (let mark of marks) {
                totalMarks += mark;
            }
            let percentage = (totalMarks / (marks.length * 100)) * 100;
            return percentage.toFixed(2);
        }

        let numSubjects = parseInt(prompt("Enter the number of subjects:"));
        let marksArray = [];
        for (let i = 0; i < numSubjects; i++) {
            let mark = parseInt(prompt(`Enter marks for subject ${i + 1} out of 100 :`));
            marksArray.push(mark);
        }

        let percentage = calculatePercentage(...marksArray);
        document.write(`The percentage of the student is: ${percentage}%`);
    </script>
       
</head>
<body>
    
</body>
</html>
