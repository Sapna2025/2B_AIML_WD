<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Operator</title>
    <script>
        
        function sum(...marks){
            let total=0;
            for(let i of marks){
                total+=i;
            }
            return total;
        }
        document.write("Total marks is "+sum(10,20,30,40,50));
    </script>
</head>

</body>
</html>
