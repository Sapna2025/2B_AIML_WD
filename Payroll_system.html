<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee and Manager Payroll System</title>
    <script>
        class Employee{
            constructor( id,name, basicSalary){
                this.id=id;
                this.name=name;
                this.basicSalary=basicSalary;
            }
            calculateSalary(){
                return this.basicSalary;
            }
        }
        class Manager extends Employee{
            constructor(id,name,basicSalary,incentive){
                super(id,name,basicSalary);
                this.incentive=incentive;
            }
            calculateSalary(){
                return this.basicSalary+this.incentive;
            }
        }
        let emp1=new Employee(101,"Tejasvi",50000);
        let manager1=new Manager(102,"Alice",60000,10000);
        document.write("Employee Salary: "+emp1.calculateSalary()+"<br>");
        document.write("Manager Salary: "+manager1.calculateSalary()+"<br>");
    </script>
</head>
<body>
    
</body>
</html>
