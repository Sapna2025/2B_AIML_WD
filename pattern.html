<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangular Pattern using Arrow Function</title>
    <script>
        
       let row=parseInt(prompt("Enter number of rows:"));
       let pattern=()=>{
        for(let i=1;i<=row;i++){
            for(let j=1;j<=i;j++){
                document.write("* ");
            }
            document.write("<br>");
        }
    }
    pattern();
        

    </script>
</head>
<body>
    
</body>
</html>
