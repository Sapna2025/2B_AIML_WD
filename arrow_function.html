<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
    <script>
        hello=()=>document.write("Hello World"+"<br>");
        hello();
        let marks=70;
        physics=marks=>`${marks}`;
        document.write(physics(marks)+"<br>");
        let firstName="Sapna";
        let LastName="Saini";
        fullName=(first,last)=>`${first} ${last}`;
        document.write(fullName(firstName,LastName));


    </script>
</head>
<body>
    
</body>
</html>
