<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function sum(){
        let age=parseInt(prompt("Enter the value of age : ",));
        if(age>=18){
           let c=confirm("Do you want to submit your response?");
           if(c){
            alert("Your response is submitted.")
           }
           else{
            alert("Thank You!")
           }
        }
        else{
            alert("You are not eligible");
        }
        //let c=confirm("----")--.takes user confirmation
    }
</script>
<body>
    <input type="button" onclick="sum()" value="result">
    
</body>
</html>
